# Deployment config for the python flask app

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: uzek/bookstore-app:v1 # Change name to your Docker Hub username
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_HOST
              value: "mongodb-service" # Service Discovery
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: NodePort
  selector:
    app: flask-app
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30007